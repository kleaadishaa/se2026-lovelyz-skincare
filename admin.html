<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Lovelyz Skincare</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous">
    <style>
        :root {
            --cream: #f9f4ef;
            --blush: #e8d5c4;
            --rose: #c9897a;
            --deep: #2c1f1a;
            --muted: #7a6860;
            --card-bg: #ffffff;
            --border: #e2d4ca;
            --success: #6aab8e;
            --error: #c97a7a;
            --sidebar-w: 240px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--cream);
            color: var(--deep);
            min-height: 100vh;
            display: flex;
        }

        /* ── SIDEBAR ── */
        .sidebar {
            width: var(--sidebar-w);
            background: var(--deep);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            position: fixed;
            top: 0; left: 0;
        }

        .sidebar-brand {
            padding: 2rem 1.5rem 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .sidebar-brand h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--cream);
            letter-spacing: 0.04em;
        }

        .sidebar-brand p {
            font-size: 0.7rem;
            color: var(--rose);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-top: 0.2rem;
        }

        .sidebar-nav {
            padding: 1.5rem 0;
            flex: 1;
        }

        .nav-label {
            font-size: 0.6rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.3);
            padding: 0 1.5rem;
            margin-bottom: 0.5rem;
            margin-top: 1rem;
            display: block;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.75rem 1.5rem;
            color: rgba(255,255,255,0.6);
            font-size: 0.85rem;
            text-decoration: none;
            border-left: 3px solid transparent;
            transition: background 0.18s, color 0.18s;
            cursor: pointer;
        }

        .nav-item:hover {
            background: rgba(255,255,255,0.06);
            color: var(--cream);
        }

        .nav-item.active {
            background: rgba(201,137,122,0.15);
            color: var(--rose);
            border-left-color: var(--rose);
        }

        .nav-item i { width: 16px; text-align: center; font-size: 0.85rem; }

        .sidebar-footer {
            padding: 1.2rem 1.5rem;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .btn-back {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.78rem;
            color: rgba(255,255,255,0.4);
            text-decoration: none;
            transition: color 0.18s;
            letter-spacing: 0.06em;
        }

        .btn-back:hover { color: var(--cream); }

        /* ── MAIN ── */
        .main {
            margin-left: var(--sidebar-w);
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
        }

        .topbar-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--deep);
        }

        .topbar-sub {
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 0.1rem;
        }

        .content {
            padding: 2rem;
            flex: 1;
        }

        /* ── PANELS ── */
        .panel { display: none; }
        .panel.active { display: block; }

        /* ── SECTION LABEL ── */
        .section-label {
            font-size: 0.68rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--rose);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ── FORM CARD ── */
        .form-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 2px;
            padding: 2rem;
            max-width: 680px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group.full { grid-column: 1 / -1; }

        .form-group label {
            font-size: 0.65rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 400;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 0.6rem 0.9rem;
            border: 1px solid var(--border);
            border-radius: 2px;
            background: var(--cream);
            font-size: 0.88rem;
            font-family: 'Segoe UI', sans-serif;
            color: var(--deep);
            outline: none;
            transition: border-color 0.18s, background 0.18s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--rose);
            background: #fff;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 90px;
        }

        /* ── BUTTONS ── */
        .form-actions {
            display: flex;
            gap: 0.8rem;
            margin-top: 1.6rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn-primary {
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-family: 'Segoe UI', sans-serif;
            color: var(--cream);
            background: var(--rose);
            border: 1px solid var(--rose);
            border-radius: 2px;
            padding: 0.55rem 1.4rem;
            cursor: pointer;
            transition: opacity 0.18s;
        }

        .btn-primary:hover { opacity: 0.85; }

        .btn-secondary {
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-family: 'Segoe UI', sans-serif;
            color: var(--muted);
            background: none;
            border: 1px solid var(--border);
            border-radius: 2px;
            padding: 0.55rem 1.4rem;
            cursor: pointer;
            transition: border-color 0.18s, color 0.18s;
        }

        .btn-secondary:hover { border-color: var(--muted); color: var(--deep); }

        .btn-danger {
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-family: 'Segoe UI', sans-serif;
            color: var(--error);
            background: none;
            border: 1px solid var(--error);
            border-radius: 2px;
            padding: 0.55rem 1.4rem;
            cursor: pointer;
            transition: background 0.18s, color 0.18s;
        }

        .btn-danger:hover { background: var(--error); color: #fff; }

        /* ── DELETE CARD ── */
        .delete-card {
            background: var(--card-bg);
            border: 1px solid #e8b0b0;
            border-radius: 2px;
            padding: 2rem;
            max-width: 680px;
        }

        .delete-note {
            font-size: 0.78rem;
            color: var(--muted);
            margin-bottom: 1.2rem;
            line-height: 1.6;
        }

        .delete-note strong { color: var(--error); }

        /* ── RESPONSIVE ── */
        @media (max-width: 768px) {
            .sidebar { width: 200px; }
            .main { margin-left: 200px; }
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full { grid-column: 1; }
            .content { padding: 1.2rem; }
        }
    </style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
    <div class="sidebar-brand">
        <h2>Lovelyz</h2>
        <p>Admin Panel</p>
    </div>

    <nav class="sidebar-nav">
        <span class="nav-label">Products</span>
        <a class="nav-item active" onclick="showPanel('create', this)">
            <i class="fa-regular fa-square-plus"></i> Create Product
        </a>
        <a class="nav-item" onclick="showPanel('delete', this)">
            <i class="fa-regular fa-trash-can"></i> Delete Product
        </a>
    </nav>

    <div class="sidebar-footer">
        <a href="index.html" class="btn-back">
            <i class="fa-solid fa-arrow-left"></i> Back to Store
        </a>
    </div>
</aside>

<!-- MAIN -->
<div class="main">

    <div class="topbar">
        <div class="topbar-title" id="topbar-title">Create Product</div>
        <div class="topbar-sub" id="topbar-sub">Add a new product to the store</div>
    </div>

    <div class="content">

        <!-- ── CREATE PANEL ── -->
        <div class="panel active" id="panel-create">
            <p class="section-label">New Product</p>

            <div class="form-card">
                <div class="form-grid">

                    <div class="form-group">
                        <label for="c-name">Product Name</label>
                        <input type="text" id="c-name" placeholder="e.g. Hydrating Facial Cleanser">
                    </div>

                    <div class="form-group">
                        <label for="c-category">Category</label>
                        <select id="c-category">
                            <option value="">— Select —</option>
                            <option value="Cleansers">Cleansers</option>
                            <option value="Suncream">Suncream</option>
                            <option value="Masks">Masks</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="c-price">Price ($)</label>
                        <input type="number" id="c-price" placeholder="0.00" min="0" step="0.01">
                    </div>

                    <div class="form-group">
                        <label for="c-stock">Stock</label>
                        <input type="number" id="c-stock" placeholder="0" min="0">
                    </div>

                    <div class="form-group full">
                        <label for="c-description">Description</label>
                        <textarea id="c-description" placeholder="Brief product description..."></textarea>
                    </div>

                    <div class="form-group full">
                        <label for="c-image">Image Path</label>
                        <input type="text" id="c-image" placeholder="assets/images/filename.jpg">
                    </div>

                </div>

                <div class="form-actions">
                    <button class="btn-primary">
                        <i class="fa-regular fa-floppy-disk"></i> Save Product
                    </button>
                    <button class="btn-secondary" type="button">Clear</button>
                </div>
            </div>
        </div>

        <!-- ── DELETE PANEL ── -->
        <div class="panel" id="panel-delete">
            <p class="section-label">Delete Product</p>

            <div class="delete-card">
                <p class="delete-note">
                    Enter the <strong>Product ID</strong> of the product you want to permanently delete.
                    This action cannot be undone.
                </p>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="d-id">Product ID</label>
                        <input type="number" id="d-id" placeholder="e.g. 1" min="1">
                    </div>
                </div>

                <div class="form-actions">
                    <button class="btn-danger">
                        <i class="fa-regular fa-trash-can"></i> Delete Product
                    </button>
                    <button class="btn-secondary" type="button">Clear</button>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    function showPanel(name, item) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

        document.getElementById('panel-' + name).classList.add('active');
        item.classList.add('active');

        const titles = {
            create: ['Create Product', 'Add a new product to the store'],
            delete: ['Delete Product', 'Permanently remove a product by ID']
        };

        document.getElementById('topbar-title').textContent = titles[name][0];
        document.getElementById('topbar-sub').textContent = titles[name][1];
    }
</script>

</body>
</html>
